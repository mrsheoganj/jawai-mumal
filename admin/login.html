<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | Jawai Mumal</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: radial-gradient(circle at center, #161c24 0%, #0b0f14 100%);">

  <div style="width: 100%; max-width: 440px; padding: 2rem;">
    
    <div style="background: var(--admin-card); border: 1px solid var(--color-sand-border); border-radius: var(--radius-md); padding: 2.8rem; box-shadow: 0 15px 35px rgba(0,0,0,0.5); position: relative;">
      
      <!-- Logo & Branding -->
      <div style="text-align: center; margin-bottom: 2rem;">
        <img src="../assets/images/favicon.svg" alt="Jawai Mumal" style="width: 52px; height: 52px; margin: 0 auto 0.8rem auto;">
        <h1 class="font-royal" style="font-size: 1.5rem; letter-spacing: 2px; color: #fff;">JAWAI MUMAL</h1>
        <p style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--color-brass-light);">
          Hotel • Restro • Jawai Safari Admin
        </p>
      </div>

      <div id="errorMsg" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 6px; padding: 0.8rem 1rem; color: #ef4444; font-size: 0.85rem; margin-bottom: 1.5rem;">
      </div>

      <!-- Login Form -->
      <form id="adminLoginForm" onsubmit="handleLogin(event)">
        <div class="admin-form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="admin-input" required value="admin">
        </div>

        <div class="admin-form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="admin-input" required value="admin123">
        </div>

        <button type="submit" class="btn btn-forest" style="width: 100%; margin-top: 1rem; font-size: 0.92rem; background: var(--color-brass);">
          Authenticate to Dashboard
        </button>
      </form>

      <!-- Hint -->
      <div style="background: var(--admin-sidebar); border: 1px solid var(--admin-border); border-radius: 6px; padding: 0.8rem; margin-top: 1.8rem; font-size: 0.8rem; color: var(--admin-muted); text-align: center;">
        Default Credentials: <strong style="color: #fff;">admin</strong> / <strong style="color: #fff;">admin123</strong>
      </div>

      <div style="text-align: center; margin-top: 1.5rem;">
        <a href="../index.html" style="color: var(--admin-muted); font-size: 0.85rem; text-decoration: none;">
          ← Return to Guest Website
        </a>
      </div>

    </div>

  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      if (u === 'admin' && p === 'admin123') {
        localStorage.setItem('jawai_admin_logged_in', 'true');
        window.location.href = 'index.html';
      } else {
        const err = document.getElementById('errorMsg');
        err.style.display = 'block';
        err.textContent = 'Invalid credentials. Please use admin / admin123';
      }
    }
  </script>

</body>
</html>
